<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Crisp, professional dark slate background with 12px border radius -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  
  <!-- Subtle border for crisp contrast on dark or light browser tabs -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1" />
  
  <!-- Minimalist, elegant shopping bag in crisp white -->
  <path 
    d="M18 24 L22 50 C22.3 52 24 53.5 26 53.5 L38 53.5 C40 53.5 41.7 52 42 50 L46 24 Z" 
    fill="none" 
    stroke="#f8fafc" 
    stroke-width="3.5" 
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  
  <!-- Bag Handle -->
  <path 
    d="M25 24 C25 17 28 12 32 12 C36 12 39 17 39 24" 
    fill="none" 
    stroke="#f8fafc" 
    stroke-width="3.5" 
    stroke-linecap="round"
  />
  
  <!-- Authentic Emerald Quality Dot -->
  <circle cx="32" cy="38" r="3.5" fill="#10b981" />
</svg>