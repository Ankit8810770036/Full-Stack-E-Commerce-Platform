apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cartify
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/ankit8810770036/full-stack-e-commerce-platform/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: USER_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: cartify-config
                  key: USER_SERVICE_URI
            - name: PRODUCT_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: cartify-config
                  key: PRODUCT_SERVICE_URI
            - name: ORDER_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: cartify-config
                  key: ORDER_SERVICE_URI
            - name: PORT
              value: "8085"
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cartify
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8085
      targetPort: 8085
